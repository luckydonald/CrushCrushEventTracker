[project]
name = "ccet-crawler"
version = "0.0.1"
description = "Data collection pipeline for the CrushCrush Event Tracker guide."
requires-python = ">=3.14"
dependencies = [
    "requests>=2.32,<3",
    "beautifulsoup4>=4.12,<5",
    "pydantic>=2.9,<3",
    "markdownify>=0.13,<2",
]

[project.scripts]
ccet-crawler = "ccet_crawler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[dependency-groups]
dev = []
