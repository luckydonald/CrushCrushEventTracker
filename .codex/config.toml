# [plugins].*.enabled below is managed by scripts/°base/ai/settings/sync.py from ai/tool-settings/settings.json's enabledPlugins; other content here is preserved.

[plugins."openai-developers@openai-developers"]
enabled = true

# --- BEGIN generated mcp_servers (scripts/°base/ai/settings/sync.py) ---

[mcp_servers."bugsink"]
command = "npx"
args = ["-y", "envmcp", "--env-file", "ai/.env", "npx", "-y", "bugsink-mcp"]
enabled = false

# --- END generated mcp_servers ---
